<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>لوحة التحكم | 𝗗𝗢𝗖𝗧𝗢𝗥 𝗖𝗢𝗗𝗘 𝗘𝗟 𝗬𝗢𝗨𝗧𝗨𝗕𝗘𝗥</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at 20% 30%, #0a0a1a, #010005);
      color: #fff;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .dashboard-wrapper {
      max-width: 1300px;
      margin: 0 auto;
    }
    /* الهيدر البطاقي */
    .glass-header {
      background: rgba(15, 15, 25, 0.7);
      backdrop-filter: blur(14px);
      border-radius: 48px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.4);
    }
    .user-greeting h2 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #fff, #00f3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .user-badge {
      display: inline-block;
      background: rgba(0, 243, 255, 0.2);
      border: 1px solid #00f3ff;
      border-radius: 40px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
    .logout-btn {
      background: transparent;
      border: 2px solid #ff3366;
      color: #ff3366;
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .logout-btn:hover {
      background: #ff3366;
      color: #000;
      box-shadow: 0 0 18px #ff3366;
    }
    /* بطاقات الإحصائيات */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 1.5rem;
      text-align: center;
      border: 1px solid rgba(0, 243, 255, 0.2);
      transition: 0.2s;
    }
    .stat-card:hover {
      border-color: #ff00cc;
      transform: translateY(-3px);
    }
    .stat-number {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f3ff, #ff00cc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .stat-label {
      color: #bbb;
      margin-top: 0.4rem;
    }
    /* شريط الأزرار */
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .action-btn {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      border: 2px solid;
      border-radius: 60px;
      padding: 0.7rem 1.8rem;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .action-btn.upload { border-color: #00ff88; color: #00ff88; }
    .action-btn.upload:hover { background: #00ff88; color: #000; box-shadow: 0 0 20px #00ff88; }
    .action-btn.bots { border-color: #00f3ff; color: #00f3ff; }
    .action-btn.bots:hover { background: #00f3ff; color: #000; }
    .action-btn.devices { border-color: #ffcc00; color: #ffcc00; }
    .action-btn.devices:hover { background: #ffcc00; color: #000; }
    /* قائمة البوتات الأخيرة */
    .recent-section {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 1.5rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .section-title {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      padding-right: 0.5rem;
      border-right: 4px solid #00f3ff;
    }
    .bots-table {
      width: 100%;
      border-collapse: collapse;
    }
    .bots-table th, .bots-table td {
      padding: 0.8rem;
      text-align: right;
      border-bottom: 1px solid #2a2a3a;
    }
    .bots-table th {
      color: #00f3ff;
      font-weight: 600;
    }
    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.8rem;
    }
    .status-running { background: #00cc6644; color: #00ffaa; }
    .status-stopped { background: #555; color: #ccc; }
    .console-link {
      color: #00f3ff;
      text-decoration: none;
    }
    .console-link:hover {
      text-shadow: 0 0 6px cyan;
    }
    .empty-message {
      text-align: center;
      padding: 2rem;
      color: #aaa;
    }
    @media (max-width: 700px) {
      body { padding: 1rem; }
      .glass-header { flex-direction: column; text-align: center; }
      .bots-table th, .bots-table td { font-size: 0.8rem; padding: 0.5rem; }
    }
  </style>
</head>
<body>
<div class="dashboard-wrapper">
  <!-- الهيدر -->
  <div class="glass-header">
    <div class="user-greeting">
      <h2>مرحباً، <span id="username">...</span></h2>
      <div class="user-badge" id="planBadge">خطة مجانية</div>
    </div>
    <button id="logoutButton" class="logout-btn">🚪 تسجيل الخروج</button>
  </div>

  <!-- إحصائيات سريعة -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-number" id="botsCount">0</div>
      <div class="stat-label">إجمالي البوتات</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="botsLimit">3</div>
      <div class="stat-label">الحد الأقصى</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="runningCount">0</div>
      <div class="stat-label">بوتات نشطة</div>
    </div>
  </div>

  <!-- أزرار الإجراءات -->
  <div class="actions-bar">
    <a href="/upload" class="action-btn upload">📤 رفع بوت (ZIP)</a>
    <a href="/bots" class="action-btn bots">🤖 إدارة البوتات</a>
    <a href="/devices" class="action-btn devices">📱 الأجهزة المتصلة</a>
  </div>

  <!-- آخر البوتات -->
  <div class="recent-section">
    <div class="section-title">📦 أحدث البوتات</div>
    <div id="recentBotsContainer">
      <div class="empty-message">جاري التحميل...</div>
    </div>
  </div>
</div>

<script>
  const logoutBtn = document.getElementById('logoutButton');
  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  async function loadDashboard() {
    try {
      // جلب بيانات المستخدم
      const meRes = await fetch('/api/me');
      if (!meRes.ok) return window.location.href = '/login';
      const user = await meRes.json();
      document.getElementById('username').innerText = user.username;
      const planText = user.plan === 'free' ? '📀 خطة مجانية (حد أقصى 3 بوتات)' : '💎 خطة بريميوم (بوتات غير محدودة)';
      document.getElementById('planBadge').innerText = planText;
      document.getElementById('botsCount').innerText = user.bots.length;
      document.getElementById('botsLimit').innerHTML = user.plan === 'free' ? '3' : '∞';

      // جلب البوتات
      const botsRes = await fetch('/api/bots');
      const botsData = await botsRes.json();
      const bots = botsData.bots || [];
      const running = bots.filter(b => b.status === 'running').length;
      document.getElementById('runningCount').innerText = running;

      const container = document.getElementById('recentBotsContainer');
      if (bots.length === 0) {
        container.innerHTML = '<div class="empty-message">✨ لا توجد بوتات بعد. ارفع أول بوت الآن!</div>';
        return;
      }
      // عرض آخر 4 بوتات
      const recent = bots.slice(0, 4);
      let html = `<table class="bots-table">
        <thead>
          <tr><th>اسم البوت</th><th>النوع</th><th>الحالة</th><th></th></tr>
        </thead><tbody>`;
      recent.forEach(bot => {
        html += `
          <tr>
            <td><strong>${escapeHtml(bot.name)}</strong></td>
            <td>${bot.type === 'node' ? 'Node.js' : 'Python'}</td>
            <td><span class="status-badge ${bot.status === 'running' ? 'status-running' : 'status-stopped'}">${bot.status === 'running' ? '▶ يعمل' : '⏹ متوقف'}</span></td>
            <td><a href="/console?botId=${bot.botId}" class="console-link">🖥 فتح الكونسول</a></td>
          </tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    } catch (err) {
      console.error(err);
      document.getElementById('recentBotsContainer').innerHTML = '<div class="empty-message">خطأ في تحميل البيانات</div>';
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  loadDashboard();
</script>
</body>
</html>
